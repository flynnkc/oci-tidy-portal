replicaCount: 1

image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets:
  - name: ocirsecret
nameOverride: ""
fullnameOverride: ""

containerPort: 5000
deploymentAnnotations: {}
podAnnotations: {}
podLabels: {}

config:
  create: true
  existingConfigMap: ""
  appUri: ""
  proxy: "true"
  tagNamespace: ""
  tagKey: ""
  filterNamespace: ""
  filterKey: ""
  cleanupCompartment: ""
  authType: instance_principal
  configFile: ""
  profile: ""
  idmEndpoint: ""
  clientId: ""
  sessionBackend: filesystem
  sessionKeyPrefix: "oci-management-portal"
  sessionRedisUrl: ""
  sessionRedisUsername: ""
  logLevel: INFO
  logFormat: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

secret:
  create: false
  existingSecret: "oci-management-portal-secrets"
  clientSecret: ""
  sessionRedisPassword: ""
  extraEnv: {}

redis:
  enabled: false
  image:
    repository: docker.io/library/redis
    tag: 7.0-alpine
    pullPolicy: IfNotPresent
  port: 6379
  auth:
    enabled: false
  resources: {}

service:
  type: LoadBalancer
  port: 80
  annotations: {}

# Reserved for profile or workload-principal deployments. The current portal
# templates do not mount these fields; keep OCI credentials outside the chart.
serviceAccount:
  create: false
  name: ""
