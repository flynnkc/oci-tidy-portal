apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tag-updater.fullname" . }}
  namespace: {{ include "tag-updater.namespace" . }}
  labels:
    {{- include "tag-updater.labels" . | nindent 4 }}
data:
  TAG_NAMESPACE: {{ .Values.config.tagNamespace | quote }}
  TAG_KEY: {{ .Values.config.tagKey | quote }}
  DAYS: {{ .Values.config.days | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  OCI_SIGNER: {{ .Values.config.ociSigner | quote }}
  {{- if .Values.config.compartments }}
  COMPARTMENTS: {{ join "," .Values.config.compartments | quote }}
  {{- end }}
  {{- if .Values.config.ociIdentityRegion }}
  OCI_IDENTITY_REGION: {{ .Values.config.ociIdentityRegion | quote }}
  {{- end }}
  {{- if .Values.config.ociResourcePrincipalRegion }}
  OCI_RESOURCE_PRINCIPAL_REGION: {{ .Values.config.ociResourcePrincipalRegion | quote }}
  {{- end }}
  {{- if .Values.config.ociTenancyId }}
  OCI_TENANCY_ID: {{ .Values.config.ociTenancyId | quote }}
  {{- end }}

